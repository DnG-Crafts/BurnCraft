[package]
name = "burncraft"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
bc-camera = { version = "0.1.0", path = "../bc-camera" }
bc-doc = { version = "0.1.0", path = "../bc-doc" }
bc-galvo = { version = "0.1.0", path = "../bc-galvo" }
bc-geom = { version = "0.1.0", path = "../bc-geom" }
bc-grbl = { version = "0.1.0", path = "../bc-grbl" }
bc-io = { version = "0.1.0", path = "../bc-io" }
bc-job = { version = "0.1.0", path = "../bc-job" }
bc-lp2 = { version = "0.1.0", path = "../bc-lp2" }
bc-raster = { version = "0.1.0", path = "../bc-raster" }
bc-ruida = { version = "0.1.0", path = "../bc-ruida" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", features = ["persistence", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
tiny-skia = "0.11.4"
winresource = "0.1.34"

[dev-dependencies]
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
